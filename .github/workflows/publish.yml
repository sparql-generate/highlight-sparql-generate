# Publish on a version tag (vX.Y.Z, the version of package.json and of
# pygments-sparql-generate/pyproject.toml), without any token:
#   - pygments-sparql-generate to PyPI, by trusted publishing: the PyPI project
#     trusts this repository, workflow publish.yml and environment pypi;
#   - highlight-sparql-generate to npm, by trusted publishing (OIDC, npm >= 11.5.1,
#     provenance attached automatically): the npm package trusts this
#     repository and workflow publish.yml.
# Run by hand (workflow_dispatch) it publishes the current package.json version to
# npm only, for a version whose tag was pushed before npm trusted the workflow.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  pypi:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the version against the tag
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pygments-sparql-generate/pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME"
      - run: pip install build && python -m build pygments-sparql-generate --outdir dist-py
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-py

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the version against the tag
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # trusted publishing needs npm 11.5.1 or later (Node 22 ships npm 10)
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --access public
