# npm test (TextMate, highlight.js, Prism, CodeMirror 6) and pytest (Pygments)
# on every push and pull request. The syntax check of the fixtures against
# the Java engine downloads the latest release JAR.
name: Test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SPARQL-Generate JAR (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo sparql-generate/sparql-generate \
            --pattern 'sparql-generate-[0-9]*[0-9].jar' --output sparql-generate.jar || true
      - run: npm ci
      - name: npm test
        run: |
          if [ -f sparql-generate.jar ]; then export SPARQL_GENERATE_JAR="$PWD/sparql-generate.jar"; fi
          npm test
      - run: pip install -e 'pygments-sparql-generate[test]'
      - run: pytest
